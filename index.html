  <script>
/* =========================================================
   BMB3 — APRESENTAÇÃO REAL

   MODO DIRETO:
     BMB3 abre e permanece somente na apresentação.

   MODO CICLO:
     CONTROLADOR → BMB3 → OBRAS → SALDO → CONTROLADOR

   ESTA VERSÃO É PARA GITHUB PAGES / HTML EXTERNO.
   A navegação não depende do sandbox do Apps Script.

   IMPORTANTE:
   Como a navegação é full-page, o Controller não fica
   aberto enquanto o BMB3 está na tela. Por isso o Controller
   entrega ao BMB3, pela URL, o próximo destino e o tempo.
   O BMB3 executa a troca quando os 30s terminam.
   ========================================================= */

let temporizadorIntro = null;

/*
 * ESTA VERSÃO NÃO USA google.script.url.getLocation().
 * Os parâmetros são lidos diretamente de window.location.search,
 * pois o arquivo será hospedado fora do HTML Service do Apps Script.
 */
function obterConfiguracaoPorURL(callback) {
  /*
   * VERSÃO EXTERNA — GITHUB PAGES
   *
   * Esta página não roda dentro do HTML Service do Apps Script.
   * Portanto, os parâmetros podem ser lidos diretamente da URL.
   *
   * Exemplos:
   *   /?modo=direto
   *   /?modo=ciclo&proximo=https%3A%2F%2F...&tempo=30000&bolinhas=10
   */
  try {
    const params = new URLSearchParams(window.location.search);

    const configuracao = {
      modo: params.get('modo') || '',
      proximo: params.get('proximo') || '',
      tempo: Number(params.get('tempo')) || 30000,
      bolinhas: Number(params.get('bolinhas')) || 10
    };

    console.log('BMB3 — parâmetros recebidos pela página externa:', configuracao);

    callback(configuracao);
  } catch (erro) {
    console.error('BMB3 — erro ao ler parâmetros da URL:', erro);

    callback({
      modo: '',
      proximo: '',
      tempo: 30000,
      bolinhas: 10
    });
  }
}

function iniciar() {
  obterConfiguracaoPorURL(function(configuracao) {

    console.log('==========================================');
    console.log('BMB3 — APRESENTAÇÃO');
    console.log('MODO:', configuracao.modo || 'direto');
    console.log('TEMPO:', configuracao.tempo, 'ms');
    console.log('PRÓXIMO:', configuracao.proximo || '(nenhum)');
    console.log('BOLINHAS:', configuracao.bolinhas);
    console.log('==========================================');

    iniciarApresentacao(configuracao);
  });
}

function iniciarContadorBolinhas(tempoTotal, quantidade) {
  const container = document.getElementById('contador-bolinhas');
  if (!container) {
    console.error('BMB3 — contador de bolinhas não encontrado.');
    return;
  }

  container.innerHTML = '';

  const qtd = Math.max(1, Math.min(50, quantidade || 10));
  const bolinhas = [];

  for (let i = 0; i < qtd; i++) {
    const bolinha = document.createElement('span');
    container.appendChild(bolinha);
    bolinhas.push(bolinha);
  }

  const inicio = performance.now();
  const intervalo = tempoTotal / qtd;

  function atualizar(agora) {
    const decorrido = agora - inicio;
    const apagadas = Math.min(
      qtd,
      Math.floor(decorrido / intervalo)
    );

    for (let i = 0; i < qtd; i++) {
      if (i < apagadas) {
        bolinhas[i].classList.add('apagada');
      }
    }

    if (decorrido < tempoTotal) {
      requestAnimationFrame(atualizar);
    } else {
      bolinhas.forEach(function(bolinha) {
        bolinha.classList.add('apagada');
      });
    }
  }

  requestAnimationFrame(atualizar);
}

function iniciarApresentacao(configuracao) {
  clearTimeout(temporizadorIntro);

  const intro = document.getElementById('intro');
  if (intro) {
    intro.style.display = 'flex';
    intro.classList.remove('saindo');
  }

  const tempoTotal =
    Number(configuracao.tempo) || 30000;

  const proximo =
    configuracao.proximo || '';

  iniciarContadorBolinhas(
    tempoTotal,
    configuracao.bolinhas
  );

  /* MODO DIRETO: fica somente no BMB3. */
  if (configuracao.modo !== 'ciclo') {
    console.log('BMB3 — MODO DIRETO.');
    console.log('BMB3 — apresentação permanecerá nesta página.');
    return;
  }

  /* MODO CICLO sem destino é erro de configuração. */
  if (!proximo) {
    console.error(
      'BMB3 — MODO CICLO, porém o parâmetro proximo não foi informado.'
    );
    return;
  }

  console.log('BMB3 — MODO CICLO iniciado.');
  console.log('BMB3 — aguardando', tempoTotal, 'ms.');
  console.log('BMB3 — próximo destino:', proximo);

  temporizadorIntro = setTimeout(function() {
    console.log('==========================================');
    console.log('BMB3 — 30 SEGUNDOS FINALIZADOS');
    console.log('BMB3 → OBRAS');
    console.log('DESTINO:', proximo);
    console.log('==========================================');

    /*
     * Full-page navigation.
     * O destino foi entregue pelo Controller através de ?proximo=...
     */
    /*
     * Navegação de página inteira.
     *
     * IMPORTANTE:
     * Como esta página está fora do sandbox do HTML Service,
     * a troca de página pode ser feita normalmente.
     */
    window.location.href = proximo;
  }, tempoTotal);
}

window.addEventListener('load', iniciar);
</script>
